<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukidd Barber - Editar cliente</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <div class="contenedor">
        {% include "_menu_admin.html" %}


        <h1>Ukidd Barber</h1>
        <h2>Editar cliente</h2>

        <section class="formulario">

            <form
                action="{{ url_for('editar_cliente', id_cliente=cliente['id_cliente']) }}"
                method="POST"
            >

                <label for="nombre">Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ cliente['nombre'] }}"
                    required
                >

                <label for="telefono">Teléfono</label>

                <input
                    type="text"
                    id="telefono"
                    name="telefono"
                    value="{{ cliente['telefono'] }}"
                    required
                >

                <label for="correo">Correo</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    value="{{ cliente['correo'] or '' }}"
                >

                <button type="submit">
                    Guardar cambios
                </button>

            </form>

            <a href="{{ url_for('clientes') }}">
                Volver a clientes
            </a>

        </section>

    </div>

</body>
</html>
