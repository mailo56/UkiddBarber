<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ukidd Barber - Editar barbero</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >
</head>

<body>

    <div class="contenedor">
        {% include "_menu_admin.html" %}


        <h1>Ukidd Barber</h1>
        <h2>Editar barbero</h2>

        <section class="formulario">

            <form
                action="{{ url_for(
                    'editar_barbero',
                    id_barbero=barbero['id_barbero']
                ) }}"
                method="POST"
            >

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ barbero['nombre'] }}"
                    required
                >

                <button type="submit">
                    Guardar cambios
                </button>

            </form>

            <a href="{{ url_for('barberos') }}">
                Volver a barberos
            </a>

        </section>

    </div>

</body>
</html>
